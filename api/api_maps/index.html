<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>API MAPS</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1>Tìm đường đi</h1>

        <div class="start">
            <label for="start">Điểm đi:</label>
            <input type="text" id="start" placeholder="Nhập điểm đi..." />
        </div>
        
        <div class="end">
            <label for="end">Điểm đến:</label>
            <input type="text" id="end" placeholder="Nhập điểm đến..." />
        </div>
        
        <div class="btn">
            <button id="findRoute">Tìm đường</button>
        </div>

        <br />
        <hr />
        <br />

        <div id="map"></div>
        <script 
            async 
            defer 
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBYD_UgIWWD_bjxch6604HDIeRXD5NJAos&callback=initMap"></script>
        <script src="script.js"></script>
    </body>
</html>
